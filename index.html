<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 담배 - 랜덤 추천</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button class="list-btn" id="listBtn" title="전체 목록">📋</button>

  <main class="container">
    <h1>🚬 오늘의 담배</h1>
    <p class="subtitle">카테고리를 고르고 뽑기 버튼을 눌러보세요</p>

    <div class="mode-chips" id="modeChips">
      <button class="chip active" data-mode="regular">🔴 일반</button>
      <button class="chip" data-mode="flavor">🟢 맨솔·캡슐</button>
      <button class="chip" data-mode="all">🟣 연초 전체</button>
      <button class="chip" data-mode="px">🪖 PX (군마트)</button>
      <button class="chip" data-mode="iqos">🔥 아이코스</button>
      <button class="chip" data-mode="lil">💨 릴</button>
    </div>

    <button class="gacha-btn" id="gachaBtn">🎰 뽑기!</button>

    <div class="result-card hidden" id="resultCard">
      <div class="result-label" id="resultLabel"></div>
      <div class="result-image" id="resultImage"></div>
      <div class="result-name" id="resultName">?</div>
      <div class="result-meta" id="resultMeta"></div>
      <div class="result-review" id="resultReview"></div>
    </div>
  </main>

  <div class="modal-overlay hidden" id="listModal">
    <div class="modal">
      <div class="modal-header">
        <h2>전체 담배 목록</h2>
        <button class="close-btn" id="closeModal">✕</button>
      </div>
      <div class="modal-body" id="listBody"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
