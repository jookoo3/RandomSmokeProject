<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 담배 - 랜덤 추천</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>🚬 오늘의 담배</h1>
    <p class="subtitle">버튼을 누르면 랜덤으로 골라드립니다</p>

    <div class="mode-buttons">
      <button class="mode-btn regular" data-mode="regular">
        일반<span class="desc">맨솔·캡슐 제외</span>
      </button>
      <button class="mode-btn flavor" data-mode="flavor">
        맨솔·캡슐<span class="desc">맨솔 또는 캡슐만</span>
      </button>
      <button class="mode-btn all" data-mode="all">
        전체<span class="desc">전부 포함</span>
      </button>
    </div>

    <div class="result-card hidden" id="resultCard">
      <div class="result-label" id="resultLabel"></div>
      <div class="result-name" id="resultName">?</div>
      <div class="result-meta" id="resultMeta"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
